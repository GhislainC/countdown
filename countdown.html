<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte à Rebours Configurable</title>
    <link href="font.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <!-- Panneau de configuration du compte à rebours -->
    <section id="config" class="panel hidden" aria-label="Configuration du compte à rebours">
        <div class="config-item">
            <label for="duration">Durée (en minutes) :</label>
            <input type="number" id="duration" min="1" value="45">
        </div>
        <div class="config-item">
            <label for="threshold">Seuil d'avertissement (en secondes) :</label>
            <input type="number" id="threshold" min="1" value="120">
        </div>
        <button id="startButton" type="button">Charger</button>
    </section>

    <!-- Panneau d'édition de message broadcast -->
    <section id="message-editor" class="panel hidden" aria-label="Éditeur de message">
        <div class="config-item">
            <label for="message-duration">Durée (en s) :</label>
            <input type="number" id="message-duration" min="1" value="10">
        </div>
        <div class="config-item">
            <label for="message-content">Message :</label>
            <input id="message-content" type="text">
        </div>
        <div class="config-item">
            <label for="message-color">Couleur :</label>
            <input id="message-color" type="text" value="amber">
        </div>
        <button id="send_message" type="button">Envoyer</button>
    </section>

    <!-- Contrôles principaux -->
    <nav id="main_controls" class="buttons" aria-label="Contrôles du compte à rebours">
        <button id="sub10min" type="button">-10 min</button>
        <button id="sub5min" type="button">-5 min</button>
        <button id="sub1min" type="button">-1 min</button>
        <button id="pauseButton" type="button">Pause</button>
        <button id="add1min" type="button">+1 min</button>
        <button id="add5min" type="button">+5 min</button>
        <button id="add10min" type="button">+10 min</button>
        <button id="timeOnly" type="button">Heure</button>
        <button id="toggleConfig" type="button">Config</button>
        <button id="toggleMessage" type="button">Message</button>
    </nav>

    <!-- zone d'affichage principal -->
    <main class="display-container">
        <div id="countdown" aria-live="polite">--:--</div>
        <div id="message" class="hidden" aria-live="assertive"></div>
        <div id="current-time">-- -------- -- --:--</div>
    </main>

    <script src="app.js"></script>
</body>
</html>
